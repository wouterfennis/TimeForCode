name: Continuous Integration Stable

on:
  push:
    branches:
      - main

jobs:
  frontend:
    name: Front-end checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: src/Frontend/TimeForCode.Frontend

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version-file: src/Frontend/TimeForCode.Frontend/.nvmrc
        cache: npm
        cache-dependency-path: src/Frontend/TimeForCode.Frontend/package-lock.json

    - name: Install dependencies
      run: npm ci --ignore-scripts

    - name: Lint
      run: npm run lint

    - name: Type-check
      run: npm run typecheck

    - name: Test
      run: npm run test:coverage

    - name: Upload coverage
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: frontend-coverage
        path: src/Frontend/TimeForCode.Frontend/coverage/lcov.info

    - name: Build
      run: npm run build

    # Build only; pushing the image is tracked in #166
    - name: Build Docker image front-end
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: .
        file: ./Dockerfile.frontend
        tags: timeforcode-frontend:${{ github.sha }}

  build:
    name: Build and analyze
    needs: frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      IMAGE_TAG: latest

    steps:
    - name: Set up JDK 17
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
      with:
        java-version: 17
        distribution: 'zulu'

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      with:
        dotnet-version: '10.0.x' # Adjust the .NET version as needed

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:         
        fetch-depth: 0

    - name: Cache SonarQube Cloud packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~\sonar\cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: Cache SonarQube Cloud scanner
      id: cache-sonar-scanner
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: .\.sonar\scanner
        key: ${{ runner.os }}-sonar-scanner
        restore-keys: ${{ runner.os }}-sonar-scanner

    - name: Install dotnet tools
      run: dotnet tool restore

    - name: Restore dependencies
      run: dotnet restore ./TimeForCode.sln

    - name: SonarCloud Scan Start
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
          dotnet dotnet-sonarscanner begin /k:"wouterfennis_TimeForCode" /o:"wouterfennis" /d:sonar.token="$SONAR_TOKEN" /d:sonar.cs.vstest.reportsPaths=**/TestResults/**/*.trx /d:sonar.cs.vscoveragexml.reportsPaths=**/TestResults/**/*.xml /d:sonar.scanner.scanAll=true /d:sonar.exclusions="docs/**,.claude/**,scripts/**" /d:sonar.coverage.exclusions="tst/**,src/Frontend/**/*.test.tsx,src/Frontend/TimeForCode.Frontend/tests/**,src/Frontend/TimeForCode.Frontend/src/main.tsx,src/Frontend/TimeForCode.Frontend/vite.config.ts" /d:sonar.javascript.lcov.reportPaths=src/Frontend/TimeForCode.Frontend/coverage/lcov.info

    - name: Build
      run: |
          dotnet build ./TimeForCode.sln --no-restore --configuration Release

    - name: Run tests
      run: |
         dotnet test ./TimeForCode.sln --no-build --verbosity normal --configuration Release --collect "Code Coverage;Format=Xml" --logger trx --results-directory TestResults --filter "TestCategory!=E2E"

    - name: Download front-end coverage
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: frontend-coverage
        path: src/Frontend/TimeForCode.Frontend/coverage

    - name: SonarCloud Scan End
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
          dotnet dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"

    - name: Publish living documentation
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: living-documentation
        path: tst/Authorization/TimeForCode.Authorization.Specifications/bin/Release/net10.0/TestResults/living-doc.html

    - name: Publish
      run: dotnet publish ./src/Authorization/TimeForCode.Authorization.Api/*.csproj --no-build --configuration Release --output ./publish

    - name: Upload artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: dotnet-app
        path: ./publish

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version-file: src/Frontend/TimeForCode.Frontend/.nvmrc

    - name: Install markdownlint-cli
      run: npm install -g markdownlint-cli@0.49.0 --ignore-scripts

    - name: Run markdownlint
      run: markdownlint "**/*.md"

    - name: Run dotnet-format
      run: dotnet format ./TimeForCode.sln --no-restore --verify-no-changes

    - name: Run NuGet security scan
      run: |
        dotnet list ./TimeForCode.sln package --vulnerable --include-transitive 2>&1 | tee vuln-report.txt
        ! grep -q "has the following vulnerable packages" vuln-report.txt

    - name: Build Docker image API
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: .
        file: ./Dockerfile.authorization-api
        tags: ghcr.io/wouterfennis/timeforcode/timeforcode-authorization-api:${{ env.IMAGE_TAG }}

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push Docker image API
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: .
        file: ./Dockerfile.authorization-api
        push: true
        tags: ghcr.io/wouterfennis/timeforcode/timeforcode-authorization-api:${{ env.IMAGE_TAG }}

  release-please:
    name: Release Please
    needs: [build, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          release-type: simple

  push-release-images:
    name: Push versioned Docker images
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image API with version tag
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile.authorization-api
          push: true
          tags: ghcr.io/wouterfennis/timeforcode/timeforcode-authorization-api:${{ needs.release-please.outputs.tag_name }}
