name: Continuous Integration Pull Request

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  frontend:
    name: Front-end checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: src/Frontend/TimeForCode.Frontend

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version-file: src/Frontend/TimeForCode.Frontend/.nvmrc
        cache: npm
        cache-dependency-path: src/Frontend/TimeForCode.Frontend/package-lock.json

    - name: Install dependencies
      run: npm ci --ignore-scripts

    # Fails when a committed OpenAPI snapshot changed and src/api/donation.d.ts was not regenerated
    - name: API types up to date
      run: npm run check:api

    - name: Lint
      run: npm run lint

    - name: Type-check
      run: npm run typecheck

    - name: Test
      run: npm run test:coverage

    - name: Upload coverage
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: frontend-coverage
        path: src/Frontend/TimeForCode.Frontend/coverage/lcov.info

    - name: Build
      run: npm run build

    # Build only; pushing the image is tracked in #166
    - name: Build Docker image front-end
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: .
        file: ./Dockerfile.frontend
        tags: timeforcode-frontend:${{ github.sha }}

  build:
    name: Build and analyze
    needs: frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      IMAGE_TAG: ${{ github.run_number }}.${{ github.run_attempt }}

    steps:
    - name: Set up JDK 17
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
      with:
        java-version: 17
        distribution: 'zulu'

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      with:
        dotnet-version: '10.0.x' # Adjust the .NET version as needed

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:         
        fetch-depth: 0

    - name: Cache SonarQube Cloud packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~\sonar\cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: Cache SonarQube Cloud scanner
      id: cache-sonar-scanner
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: .\.sonar\scanner
        key: ${{ runner.os }}-sonar-scanner
        restore-keys: ${{ runner.os }}-sonar-scanner

    - name: Install dotnet tools
      run: dotnet tool restore

    - name: Restore dependencies
      run: dotnet restore ./TimeForCode.sln

    - name: SonarCloud Scan Start
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
          dotnet dotnet-sonarscanner begin /k:"wouterfennis_TimeForCode" /o:"wouterfennis" /d:sonar.token="$SONAR_TOKEN" /d:sonar.cs.vstest.reportsPaths=**/TestResults/**/*.trx /d:sonar.cs.vscoveragexml.reportsPaths=**/TestResults/**/*.xml /d:sonar.scanner.scanAll=true /d:sonar.exclusions="docs/**,.claude/**,scripts/**" /d:sonar.coverage.exclusions="tst/**,src/Frontend/**/*.test.tsx,src/Frontend/TimeForCode.Frontend/tests/**,src/Frontend/TimeForCode.Frontend/src/main.tsx,src/Frontend/TimeForCode.Frontend/vite.config.ts" /d:sonar.javascript.lcov.reportPaths=src/Frontend/TimeForCode.Frontend/coverage/lcov.info

    - name: Build
      run: |
          dotnet build ./TimeForCode.sln --no-restore --configuration Release

    - name: Run tests
      run: |
         dotnet test ./TimeForCode.sln --no-build --verbosity normal --configuration Release --collect "Code Coverage;Format=Xml" --logger trx --results-directory TestResults --filter "TestCategory!=E2E"

    - name: Download front-end coverage
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: frontend-coverage
        path: src/Frontend/TimeForCode.Frontend/coverage

    - name: SonarCloud Scan End
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
          dotnet dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"

    - name: Publish
      run: dotnet publish ./src/Authorization/TimeForCode.Authorization.Api/*.csproj --no-build --configuration Release --output ./publish

    - name: Upload artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: dotnet-app
        path: ./publish

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version-file: src/Frontend/TimeForCode.Frontend/.nvmrc

    - name: Install markdownlint-cli
      run: npm install -g markdownlint-cli@0.49.0 --ignore-scripts

    - name: Run markdownlint
      run: markdownlint "**/*.md"

    - name: Run dotnet-format
      run: dotnet format ./TimeForCode.sln --no-restore --verify-no-changes

    - name: Run NuGet security scan
      run: |
        dotnet list ./TimeForCode.sln package --vulnerable --include-transitive 2>&1 | tee vuln-report.txt
        ! grep -q "has the following vulnerable packages" vuln-report.txt

    - name: Build Docker image API
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: .
        file: ./Dockerfile.authorization-api
        tags: ghcr.io/wouterfennis/timeforcode/timeforcode-authorization-api:${{ env.IMAGE_TAG }}

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push Docker image API
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: .
        file: ./Dockerfile.authorization-api
        push: true
        tags: ghcr.io/wouterfennis/timeforcode/timeforcode-authorization-api:${{ env.IMAGE_TAG }}

  live:
    name: Compose stack smoke and live tier
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: live-${{ github.ref }}
      cancel-in-progress: true

    env:
      TIMEFORCODE_LIVE_DONATION_URL: http://localhost:8082
      TIMEFORCODE_LIVE_REPORTING_URL: http://localhost:8083
      TIMEFORCODE_LIVE_AUTHORIZATION_URL: http://localhost:8080
      TIMEFORCODE_LIVE_CLIENT_REDIRECT_URI: http://localhost:8084

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      with:
        dotnet-version: '10.0.x'

    - name: Generate the test admin secret
      shell: pwsh
      run: |
        $secret = [Convert]::ToBase64String([System.Security.Cryptography.RandomNumberGenerator]::GetBytes(32))
        Write-Output "::add-mask::$secret"
        Add-Content -Path $env:GITHUB_ENV -Value "TEST_ADMIN_ACCESS_SECRET=$secret"
        Add-Content -Path $env:GITHUB_ENV -Value "TIMEFORCODE_LIVE_TEST_ADMIN_SECRET=$secret"

    - name: Start the compose stack
      run: docker compose up --build --detach authorization-api identity-provider-mock donation-api reporting-api frontend mongo

    - name: Wait until the stack is healthy
      shell: pwsh
      run: |
        # The Reporting API has no anonymous endpoint, so a 401 from its report endpoint means it is up.
        $urls = [ordered]@{
          'http://localhost:8080/.well-known/openid-configuration' = 200..399
          'http://localhost:8081/.well-known/openid-configuration' = 200..399
          'http://localhost:8082/api/v1/project' = 200..399
          'http://localhost:8083/api/v1/reporting/donororganization/000000000000000000000000/impact-report' = 401
        }
        foreach ($url in $urls.Keys) {
          $deadline = (Get-Date).AddMinutes(3)
          while ($true) {
            $code = curl -s --max-time 5 -o /dev/null -w '%{http_code}' $url
            if ([int]$code -in $urls[$url]) { break }
            if ((Get-Date) -gt $deadline) { throw "$url not healthy (last status $code)" }
            Start-Sleep -Seconds 3
          }
        }

    - name: Smoke test
      shell: pwsh
      run: ./scripts/smoke-test.ps1 -ContainerCli docker

    - name: Live scenarios
      run: dotnet test tst/Donation/TimeForCode.Donation.Specifications --configuration Release --filter "TestCategory=live" --logger trx --results-directory TestResults

    - name: Live scenarios (Reporting)
      run: dotnet test tst/Reporting/TimeForCode.Reporting.Specifications --configuration Release --filter "TestCategory=live" --logger trx --results-directory TestResults

    - name: Collect container logs
      if: failure()
      run: |
        docker compose ps --all > compose-logs.txt
        docker compose logs --no-color --timestamps >> compose-logs.txt

    - name: Upload logs and results
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: live-tier-diagnostics
        if-no-files-found: ignore
        path: |
          compose-logs.txt
          TestResults

    - name: Stop the compose stack
      if: always()
      run: docker compose down --volumes
