name: Documentation Site

# Publishes docs/ (Jekyll) at the site root and the LikeC4 architecture
# model at /architecture-model/ to GitHub Pages.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/docs-site.yaml'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/docs-site.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build site
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Setup Pages
      uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

    - name: Build documentation with Jekyll
      uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
      with:
        source: ./docs
        destination: ./_site

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: docs/architecture/likec4/package-lock.json

    - name: Install LikeC4
      working-directory: docs/architecture/likec4
      run: npm ci

    - name: Validate architecture model
      working-directory: docs/architecture/likec4
      run: npm run validate

    - name: Build architecture model
      working-directory: docs/architecture/likec4
      run: npm run build

    - name: Add architecture model to site
      run: cp -r docs/architecture/likec4/dist _site/architecture-model

    - name: Upload Pages artifact
      if: github.event_name != 'pull_request'
      uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
      with:
        path: _site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
