name: Documentation Site

# Publishes docs/ (Jekyll) at the site root and the LikeC4 architecture
# model at /architecture-model/ to GitHub Pages.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/docs-site.yaml'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/docs-site.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build site
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Pages
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

    - name: Build documentation with Jekyll
      uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
      with:
        source: ./docs
        destination: ./_site

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: '26'
        cache: npm
        cache-dependency-path: docs/architecture/likec4/package-lock.json

    - name: Install LikeC4
      working-directory: docs/architecture/likec4
      run: npm ci --ignore-scripts

    - name: Validate architecture model
      working-directory: docs/architecture/likec4
      run: npm run validate

    - name: Build architecture model
      working-directory: docs/architecture/likec4
      run: npm run build -- --base "/${{ github.event.repository.name }}/architecture-model/"

    - name: Add architecture model to site
      # jekyll-build-pages runs as root in a container, so _site is root-owned.
      run: |
        sudo chown -R "$USER" _site
        cp -r docs/architecture/likec4/dist _site/architecture-model

    - name: Upload Pages artifact
      if: github.event_name != 'pull_request'
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
      with:
        path: _site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
