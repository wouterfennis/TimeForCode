name: Planned Work
description: A feature, bug fix, improvement, technical debt item, or documentation change tracked through the Plan → FeatureWriter → Implementation → Review → Markdown Lint agent workflow.
title: "[Type]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        This template backs the agent-driven planning workflow. It is normally filled in by the **Plan** agent after a planning conversation, but can be used directly for manually created issues too.

        If this issue is part of a larger feature that has been split into a parent issue with independently shippable children, fill in **Parent Issue**. If this issue *is* the parent, leave **Parent Issue** blank and fill in **Child Issues** instead as children are created.

  - type: dropdown
    id: issue-type
    attributes:
      label: Issue Type
      description: What kind of work is this? Also reflected in the issue title prefix.
      options:
        - Feature
        - Bug Fix
        - Improvement
        - Technical Debt
        - Documentation
    validations:
      required: true

  - type: dropdown
    id: issue-shape
    attributes:
      label: Issue Shape
      description: Is this a standalone issue, a parent (epic) that will be broken into children, or a child of an existing parent?
      options:
        - Standalone — this issue is small enough to ship on its own
        - Parent (epic) — this issue tracks an overall outcome delivered by child issues
        - Child — this issue is one independently shippable slice of a parent
      default: 0
    validations:
      required: true

  - type: input
    id: parent-issue
    attributes:
      label: Parent Issue
      description: "Only for a Child issue: the parent (epic) issue number this is part of, e.g. #123. Leave blank for Standalone or Parent issues."
      placeholder: "#123"
    validations:
      required: false

  - type: textarea
    id: motivation
    attributes:
      label: Motivation / Context
      description: >
        Why is this work needed, or what value does it add? For a Parent issue, describe the overall
        outcome — what "done" means once every child issue is complete. For a Child issue, describe
        this slice and how it relates to the parent.
      placeholder: |
        Explain the problem this solves or the value it adds, without assuming background knowledge.
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: >
        A high-level description of the intended approach. No code, pseudocode, or method signatures —
        describe *what* and *why*, not *how*.
      placeholder: |
        Describe the intended approach at a high level.
    validations:
      required: true

  - type: textarea
    id: affected-areas
    attributes:
      label: Affected Areas
      description: >
        List the verified components and files this issue touches (for a Parent issue, list every
        component touched by any child). Only reference things confirmed to exist in the codebase.
      placeholder: |
        - `src/Authorization/...` — reason
        - `src/Donation/...` — reason
    validations:
      required: true

  - type: textarea
    id: child-issues
    attributes:
      label: Child Issues
      description: >
        Only for a Parent (epic) issue. List each child as a checkbox referencing its issue number.
        Filled in progressively as children are created — leave blank until at least one exists.
      placeholder: |
        - [ ] #124 — Short title of child 1
        - [ ] #125 — Short title of child 2
    validations:
      required: false

  - type: checkboxes
    id: agent-phases
    attributes:
      label: Agent Phases Required
      description: >
        Only meaningful for a Standalone or Child issue — leave both unchecked to use the default
        workflow (FeatureWriter → Implementation → Review → Markdown Lint all apply).
      options:
        - label: "Implementation-only — no user-observable behavior to spec, skip the FeatureWriter phase (applies label `agent-phase:implementation-only`)"
          required: false
        - label: "Skip Markdown Lint — this issue touches no documentation or Markdown files (applies label `agent-phase:skip-markdown-lint`)"
          required: false

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: >
        Specific, measurable, independently testable conditions. For a Parent issue, this should read
        "All child issues are complete" plus any criterion that only makes sense at the overall level
        (e.g. an end-to-end scenario spanning multiple children).
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: >
        Links to relevant docs, related issues, architecture diagrams, sibling child issues this
        depends on or blocks, or any discrepancy found between documentation and code during planning.
      placeholder: |
        Optional — add anything that helps a developer with no prior context get started.
    validations:
      required: false
