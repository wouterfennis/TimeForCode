# Template: the nginx image entrypoint renders it with envsubst at container start (only the variables
# in the environment are replaced, so nginx variables like $uri stay).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers on every response, errors included ("always"). "merge" keeps
    # them in locations that add headers of their own (nginx 1.29.3 or later).
    add_header_inherit merge;
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Same-origin route to the Donation API: /api/donation/v1/Project -> /api/v1/Project. The BFF replaces it in #113.
    # The upstream is a variable, so nginx resolves it per request (with the container's DNS resolver) and not
    # while loading the configuration; the image build's `nginx -t` has no compose network.
    location /api/donation/ {
        resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;
        set $donation_api "${DONATION_API_UPSTREAM}";
        rewrite ^/api/donation/(.*)$ /api/$1 break;
        proxy_pass http://$donation_api;
        # With a variable in proxy_pass, `proxy_redirect default` is off: map the API's own absolute URLs
        # (for example the Location of a 201 Created) back to this route.
        proxy_redirect http://${DONATION_API_UPSTREAM}/api/ /api/donation/;
        # The original client, host and scheme, for when the API reads forwarded headers.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store";
    }

    # Hashed build assets never change, so they can be cached for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes fall back to index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
